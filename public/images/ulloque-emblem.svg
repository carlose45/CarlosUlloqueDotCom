<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <radialGradient id="disc" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#06141f" />
      <stop offset="62%" stop-color="#030c14" />
      <stop offset="100%" stop-color="#010305" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ff0ff" />
      <stop offset="55%" stop-color="#38e1ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="haze" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>
  </defs>

  <!-- dark disc core -->
  <circle cx="40" cy="40" r="34" fill="url(#disc)" />

  <!-- ambient inner haze -->
  <circle cx="40" cy="34" r="20" fill="#38e1ff" fill-opacity="0.08" filter="url(#haze)" />

  <!-- faint full ring -->
  <circle cx="40" cy="40" r="34" stroke="#38e1ff" stroke-opacity="0.22" stroke-width="1" />

  <!-- faint inner ring -->
  <circle cx="40" cy="40" r="26" stroke="#38e1ff" stroke-opacity="0.12" stroke-width="1" />

  <!-- bright seam arc: the open 'C' of the disc -->
  <circle
    cx="40"
    cy="40"
    r="34"
    stroke="url(#rim)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-dasharray="150 63.6"
    stroke-dashoffset="31.8"
    filter="url(#glow)"
  />

  <!-- inner 'U' light glyph -->
  <path
    d="M31 25 L31 42 Q31 50 40 50 Q49 50 49 42 L49 25"
    stroke="url(#rim)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- seam accent nodes -->
  <circle cx="73.4" cy="33" r="1.7" fill="#7ff0ff" filter="url(#glow)" />
  <circle cx="73.4" cy="47" r="1.7" fill="#7ff0ff" filter="url(#glow)" />

  <!-- circuit tick at base -->
  <path d="M40 50 L40 57" stroke="#38e1ff" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="40" cy="58.5" r="1.5" fill="#38e1ff" filter="url(#glow)" />
</svg>
