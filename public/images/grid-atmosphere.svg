<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="horizonGlow" cx="50%" cy="64%" r="62%">
      <stop offset="0%" stop-color="#38e1ff" stop-opacity="0.20" />
      <stop offset="38%" stop-color="#1f6feb" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#010305" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38e1ff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#38e1ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010305" stop-opacity="0" />
      <stop offset="100%" stop-color="#010305" stop-opacity="0.9" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <rect width="1600" height="640" fill="#010305" />
  <rect width="1600" height="640" fill="url(#horizonGlow)" />

  <!-- distant light shafts, very faint -->
  <g filter="url(#softer)">
    <rect x="430" y="120" width="120" height="300" fill="url(#shaft)" />
    <rect x="900" y="90" width="160" height="320" fill="url(#shaft)" />
    <rect x="1180" y="150" width="90" height="260" fill="url(#shaft)" />
  </g>

  <!-- distant ridge silhouettes (the Outlands) -->
  <path
    d="M0 432 L260 388 L470 424 L720 372 L1010 418 L1300 380 L1600 420 L1600 640 L0 640 Z"
    fill="#020a14"
    fill-opacity="0.55"
    filter="url(#soft)"
  />
  <path
    d="M0 470 L340 442 L600 472 L880 430 L1180 470 L1460 440 L1600 462 L1600 640 L0 640 Z"
    fill="#01060d"
    fill-opacity="0.7"
  />

  <!-- horizon seam -->
  <rect x="180" y="406" width="1240" height="2" fill="#38e1ff" fill-opacity="0.30" filter="url(#soft)" />

  <!-- depth falloff -->
  <rect width="1600" height="640" fill="url(#depth)" />
</svg>
