# nginx config for the static site, mounted into nginx:alpine behind Traefik.
# Security headers (HSTS, CSP, etc.) are applied by Traefik middleware labels
# in the production compose, matching the rest of the stack — not duplicated here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/rss+xml
        application/xml
        image/svg+xml;

    # Health endpoint for monitoring (served from /healthz, never cached).
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        try_files /healthz =404;
    }

    # /cv — extra noindex hint at the response level. Not access control;
    # real gating would be a Traefik forwardAuth/basic-auth in front later.
    location ~ ^/cv/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files /cv/index.html =404;
    }

    # Hashed Astro assets — immutable, cache forever.
    location ~* ^/_astro/.*\.(?:css|js|mjs|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images, icons, fonts — immutable, cache forever.
    location ~* \.(?:avif|gif|ico|jpg|jpeg|png|svg|webp|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML / XML / TXT — short cache, must revalidate.
    location ~* \.(?:html|xml|txt)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    # Directory-style routes (/about/ -> /about/index.html) and everything else.
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
